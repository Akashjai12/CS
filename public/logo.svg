<svg viewBox="0 0 256 256" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top-Right Violet to Royal Blue Gradient -->
    <linearGradient id="copilot-top-purple" x1="226" y1="76" x2="100" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A3FFC" />
      <stop offset="22%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#582CD6" />
      <stop offset="78%" stop-color="#304FFE" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>

    <!-- Top Arm Upper Rim Specular Highlight -->
    <linearGradient id="copilot-top-sheen" x1="220" y1="70" x2="116" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E8FF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#DDD6FE" stop-opacity="0.75" />
      <stop offset="72%" stop-color="#BAE6FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.2" />
    </linearGradient>

    <!-- Front Left Face Electric Cyan Gradient -->
    <linearGradient id="copilot-left-cyan" x1="28" y1="64" x2="96" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="22%" stop-color="#00B4D8" />
      <stop offset="52%" stop-color="#0096C7" />
      <stop offset="80%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <!-- Left Outer Specular Rim Highlight -->
    <linearGradient id="copilot-left-rim" x1="26" y1="70" x2="48" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#BAE6FD" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <!-- Inside Ambient Underlayer Shadow (Mobius Twist Core) -->
    <linearGradient id="copilot-shadow-fold" x1="64" y1="104" x2="136" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A192F" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#0F2B5C" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#1A4B9C" stop-opacity="1" />
      <stop offset="100%" stop-color="#1A73E8" stop-opacity="1" />
    </linearGradient>

    <!-- Bottom Arm: Deep Blue sweeping to Electric Cyan -->
    <linearGradient id="copilot-bottom-sweep" x1="76" y1="196" x2="228" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="25%" stop-color="#0065FF" />
      <stop offset="55%" stop-color="#0082FF" />
      <stop offset="80%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Top Cap Radial Pill Highlight -->
    <radialGradient id="copilot-top-cap" cx="210" cy="80" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="45%" stop-color="#8A3FFC" />
      <stop offset="100%" stop-color="#6B21A8" />
    </radialGradient>

    <!-- Bottom Cap Radial Pill Highlight -->
    <radialGradient id="copilot-bottom-cap" cx="210" cy="176" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#0052CC" />
    </radialGradient>

    <!-- Soft Depth Elevation Shadow -->
    <filter id="copilot-glow-shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1D4ED8" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#copilot-glow-shadow)">
    <!-- 1. UNDERLAYER: Ambient Shadow Depth (Loop underbelly connecting inside hexagon) -->
    <path
      d="M 124 73 L 84 98 C 76 104 70 114 70 126 L 72 150 C 74 162 82 174 94 180 L 124 185 C 132 185 140 181 146 175 L 126 156 C 118 160 108 158 102 150 L 96 138 C 92 128 96 116 104 110 L 124 96 Z"
      fill="url(#copilot-shadow-fold)"
    />

    <!-- 2. TOP ARM: Violet/Purple sweeping along upper edge of hexagon -->
    <path
      d="M 142 22 L 216 64 C 224 69 226 80 220 88 C 214 96 202 98 192 96 L 176 96 C 168 96 160 92 154 86 L 134 74 C 130 71 126 71 122 74 L 84 98 C 76 104 66 100 64 90 C 62 80 68 72 76 68 L 114 22 C 122 17 134 17 142 22 Z"
      fill="url(#copilot-top-purple)"
    />

    <!-- Top Arm Rounded Pill Cap -->
    <path
      d="M 192 96 C 204 98 216 94 220 86 C 224 78 222 68 214 63 L 216 64 C 224 69 226 80 220 88 C 214 96 202 98 192 96 Z"
      fill="url(#copilot-top-cap)"
    />

    <!-- Top Arm Upper Specular Rim Sheen -->
    <path
      d="M 114 22 L 142 22 L 214 63 C 210 61 156 30 138 24 C 130 21 122 21 114 24 L 76 68 C 88 50 104 28 114 22 Z"
      fill="url(#copilot-top-sheen)"
      opacity="0.9"
    />

    <!-- 3. FRONT LEFT FACE: Luminous Cyan Ribbon descending down the left facet -->
    <path
      d="M 76 68 C 84 72 88 80 84 90 L 76 112 C 72 122 68 134 68 146 L 70 162 C 72 176 62 188 48 188 C 36 188 28 178 28 164 L 28 92 C 28 80 36 70 48 64 L 76 68 Z"
      fill="url(#copilot-left-cyan)"
    />

    <!-- Left Outer Edge Specular Rim Light -->
    <path
      d="M 48 64 C 36 70 28 80 28 92 L 28 164 C 28 174 34 182 42 186 C 34 180 32 170 32 160 L 32 96 C 32 86 38 76 48 70 L 48 64 Z"
      fill="url(#copilot-left-rim)"
    />

    <!-- 4. BOTTOM ARM: Royal Blue to Electric Cyan sweeping along bottom edge -->
    <path
      d="M 48 188 C 58 188 68 182 76 174 L 98 152 C 104 146 114 144 122 148 L 148 162 C 158 168 168 168 178 164 L 214 150 C 224 146 228 154 226 164 C 224 174 214 182 204 186 L 142 234 C 134 239 122 239 114 234 L 48 188 Z"
      fill="url(#copilot-bottom-sweep)"
    />

    <!-- Bottom Arm Rounded Pill Cap -->
    <path
      d="M 204 186 C 214 182 224 174 226 164 C 228 154 222 146 212 150 L 214 150 C 224 146 228 154 226 164 C 224 174 214 182 204 186 Z"
      fill="url(#copilot-bottom-cap)"
    />

    <!-- Subtle Inner Hexagonal Rim Reflection -->
    <path
      d="M 98 104 C 106 114 110 126 108 138 C 106 148 100 158 92 166 C 94 158 96 148 94 138 C 92 128 88 118 82 112 L 98 104 Z"
      fill="#60A5FA"
      opacity="0.35"
    />
  </g>
</svg>
